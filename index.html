<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivals Ban Helper</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14161c;--mut:#667085;--bd:#dde0e8;--ac:#6d4aff;--al:#16a34a;--en:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mut:#98a2b3;--bd:#2b3040;--ac:#8f74ff;--al:#4ade80;--en:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}h2{font-size:1rem;margin:0 0 10px}
p.s{color:var(--mut);margin:0 0 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
input{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:6px}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
.drop input{display:none}img.pv{width:100%;border-radius:10px;margin-top:10px}.lk{display:inline-block;margin-top:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);color:var(--ac);font-weight:600;font-size:.85rem;text-decoration:none}.lk.f{background:var(--ac);color:#fff;border-color:var(--ac)}
.tl{font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 6px}
.al{color:var(--al)}.en{color:var(--en)}
.chip{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--bd);border-radius:99px;padding:6px 12px;margin:0 6px 8px 0;font-size:.9rem;cursor:pointer;user-select:none}
.chip.c1{border-color:var(--en);background:color-mix(in srgb,var(--en) 18%,transparent)}
.chip.c2{border-color:var(--en);background:color-mix(in srgb,var(--en) 18%,transparent)}
.chip.c0{opacity:.55}.chip i{font-style:normal;color:var(--mut)}
.row{border-top:1px solid var(--bd);padding:10px 0}
.nm{font-weight:600}.st{font-size:.8rem;color:var(--mut)}
.hero{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.sc{font-size:.8rem;color:var(--mut)}.tag{font-size:.7rem;background:var(--bd);border-radius:6px;padding:1px 6px;margin-left:6px}
.hide{display:none}.gap{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
pre{white-space:pre-wrap;word-break:break-all;font-size:.7rem;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:8px}
details{margin:6px 0 10px}summary{cursor:pointer;color:var(--mut);font-size:.9rem}
</style></head><body><main>
<h1>Rivals Ban Helper</h1>
<p class="s">Screenshot the enemy team and get a ban list.</p>

<section class="card">
<h2>Stats API setup</h2>
<input id="key" type="text" placeholder="marvelrivalsapi.com API key" autocomplete="off" autocapitalize="off" spellcheck="false">
<details><summary>Advanced</summary>
<input id="base" placeholder="API base URL" value="https://marvelrivalsapi.com/api/v1"></details>
<div class="two"><input id="tu" placeholder="Test a username"><button id="tb" class="g">Test lookup</button></div>
<div id="tr" class="st"></div>
</section>

<section class="card">
<h2>1 · Enemy team screenshot</h2>
<label class="drop"><input type="file" id="file" accept="image/*"><span id="dropt">Tap to choose a screenshot or photo</span></label>
<img id="pv" class="pv hide" alt="Preview">
<div class="gap" style="margin-top:10px"><button id="go" disabled>Scan usernames</button></div>
<p class="s" id="msg" style="margin:8px 0 0"></p>
</section>

<section class="card hide" id="s2">
<h2>2 · Confirm enemy usernames</h2>
<p class="s">Tap a name to turn it on or off. Tap ✎ to fix a misread (check <b>_</b> and <b>-</b>). Add anything it missed below.</p>
<div id="chips"></div>
<div class="two"><input id="mn" placeholder="Add a name"><button class="g" id="ma">+ Add</button></div>
<div class="gap"><button id="confirm">Confirm &amp; get top heroes</button></div>
</section>

<section class="card hide" id="s3">
<h2>3 · Top 3 heroes per player</h2>
<p class="s" id="s3m"></p><div id="plist"></div><datalist id="hl"></datalist>
<div class="gap"><button id="sum">Build ban list</button></div>
</section>

<section class="hide" id="s4">
<div class="card"><h2 class="en">Ban list</h2><div id="ban"></div></div>
</section>
</main>
<script>
const HEROES="Adam Warlock,Black Panther,Black Widow,Blade,Bruce Banner,Captain America,Cloak & Dagger,Daredevil,Doctor Strange,Emma Frost,Groot,Hawkeye,Hela,Human Torch,Invisible Woman,Iron Fist,Iron Man,Jeff the Land Shark,Loki,Luna Snow,Magik,Magneto,Mantis,Mister Fantastic,Moon Knight,Namor,Peni Parker,Phoenix,Psylocke,Punisher,Rocket Raccoon,Scarlet Witch,Spider-Man,Squirrel Girl,Star-Lord,Storm,The Thing,Thor,Ultron,Venom,Winter Soldier,Wolverine";
const HL=HEROES.split(",");
/* words that are hero names or common screen text, never usernames */
const STOP=new Set((HEROES+",attack,defend,competitive,convoy,domination,convergence,path,destroy,stop,from,being,tapping,device,ranked,unranked,victory,defeat,player,level,rank,score,kills,assists,deaths,legendary,immortal,undead,nightmare,amazing,bane,evil,king,land,shark,yggdrasill,yggsgard,match,loading,team,enemy,vs,the,and,hero,skin,mvp,all,evil,spider,man").toLowerCase().split(/[,\s&]+/).filter(Boolean));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let img=null,cands=[],players=[];
$("hl").innerHTML=HL.map(h=>`<option value="${esc(h)}">`).join("");
for(const k of ["key","base"])try{const v=localStorage.getItem("rb_"+k);if(v)$(k).value=v}catch(e){}
const save=()=>{try{localStorage.setItem("rb_key",$("key").value.trim());localStorage.setItem("rb_base",$("base").value.trim())}catch(e){}};
const prof=n=>"https://tracker.gg/marvel-rivals/profile/ign/"+encodeURIComponent(n)+"/overview";

/* ---------- OCR (whole image, usernames only) ---------- */
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const bm=await createImageBitmap(f),k=Math.min(2,Math.max(0.5,2000/bm.width));
  const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.5)";x.drawImage(bm,0,0,c.width,c.height);
  img=c;$("pv").src=URL.createObjectURL(f);$("pv").classList.remove("hide");
  $("dropt").textContent=f.name;$("go").disabled=false;
};
/* join pieces split around _ or - (OCR often breaks names there) */
function mergeWords(ws){
  ws=ws.filter(w=>w.text&&w.text.trim()).map(w=>({t:w.text.trim(),c:w.confidence,x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1}));
  ws.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
  let ch=true;
  while(ch){ch=false;
    for(let i=0;i<ws.length&&!ch;i++)for(let j=0;j<ws.length&&!ch;j++){
      if(i===j)continue;const a=ws[i],b=ws[j],h=Math.max(a.y1-a.y0,b.y1-b.y0);
      const sameLine=Math.abs((a.y0+a.y1)/2-(b.y0+b.y1)/2)<h*0.5,gap=b.x0-a.x1;
      if(sameLine&&gap>-h*0.3&&gap<h*0.9&&b.x0>=a.x0&&(/[_-]$/.test(a.t)||/^[_-]/.test(b.t))){
        ws[i]={t:a.t+b.t,c:Math.min(a.c,b.c),x0:a.x0,x1:b.x1,y0:Math.min(a.y0,b.y0),y1:Math.max(a.y1,b.y1)};ws.splice(j,1);ch=true;
      }
    }
  }
  return ws;
}
const STOPL=[...STOP];
const isStop=t=>{const l=t.toLowerCase();return STOP.has(l)||(l.length>=5&&STOPL.some(w=>w.includes(l)))};
function pickNames(words){
  const ws=mergeWords(words),seen=new Set(),out=[];
  for(const o of ws){
    let t=o.t.replace(/^[^A-Za-z0-9_]+|[^A-Za-z0-9_-]+$/g,"");
    if(/[^A-Za-z0-9_-]/.test(t))continue;               /* names have no other symbols */
    const h=o.y1-o.y0;
    /* level number just to the left on the same line (the game shows "39 SirChunk") */
    const adj=ws.some(n=>n!==o&&/^\d{1,3}$/.test(n.t.replace(/[^\d]/g,""))&&n.t.length<=4&&Math.abs((n.y0+n.y1)/2-(o.y0+o.y1)/2)<h*0.6&&o.x0-n.x1>-h*0.3&&o.x0-n.x1<h*2.5);
    const fused=t.match(/^\d{2,3}[|_-]?(?=[A-Za-z])/);   /* "39SirChunk" where the number got glued on */
    if(fused)t=t.slice(fused[0].length);
    if(t.length<3||t.length>16||!/[A-Za-z]/.test(t)||o.c<55||isStop(t)||seen.has(t.toLowerCase()))continue;
    seen.add(t.toLowerCase());
    let sc=o.c+(adj||fused?40:0);
    if(/\d/.test(t))sc+=15;if(/[_-]/.test(t))sc+=15;
    if(/[a-z]/.test(t)&&/[A-Z]/.test(t))sc+=10;
    if(/^[A-Z]+$/.test(t))sc-=25;
    out.push({t,c:o.c,sc,adj:!!(adj||fused),x0:o.x0,y0:o.y0});
  }
  return out;
}
/* fallback pass: keep only near-white text (names) and blank out art/coloured text */
function whiteMask(src){
  const c=document.createElement("canvas");c.width=src.width;c.height=src.height;
  const x=c.getContext("2d");x.drawImage(src,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    const mn=Math.min(p[i],p[i+1],p[i+2]),sat=Math.max(p[i],p[i+1],p[i+2])-mn;
    const v=sat<70?Math.max(0,Math.min(1,(mn-120)/60)):0;
    p[i]=p[i+1]=p[i+2]=255-v*255;
  }
  x.putImageData(d,0,0);return c;
}
$("go").onclick=async()=>{
  const m=$("msg");$("go").disabled=true;m.textContent="Loading OCR engine…";
  try{
    const w=await Tesseract.createWorker("eng",1,{logger:p=>{if(p.status==="recognizing text")m.textContent="Scanning… "+Math.round(p.progress*100)+"%"}});
    await w.setParameters({tessedit_pageseg_mode:"11"});
    let found=pickNames((await w.recognize(img)).data.words||[]);
    if(found.filter(o=>o.adj).length<3){
      m.textContent="Trying a second pass…";
      const more=pickNames((await w.recognize(whiteMask(img))).data.words||[]);
      const have=new Set(found.map(o=>o.t.toLowerCase()));
      more.forEach(o=>{if(!have.has(o.t.toLowerCase()))found.push(o)});
    }
    await w.terminate();
    const best=found.slice().sort((a,b)=>b.sc-a.sc).slice(0,16);
    const anyAdj=best.some(o=>o.adj);
    best.forEach((o,i)=>o.s=(i<12&&(!anyAdj||o.adj))?1:0);
    cands=best.sort((a,b)=>Math.round(a.y0/40)-Math.round(b.y0/40)||a.x0-b.x0);
    render();m.textContent=cands.length?"Done. Turn off anything that isn't a username and fix misreads with ✎.":"Nothing readable found. Add names manually below.";
  }catch(e){m.textContent="OCR failed: "+e.message+". Add names manually.";cands=[];render()}
  $("go").disabled=false;
};
function render(){
  $("s2").classList.remove("hide");
  $("chips").innerHTML="";
  cands.forEach(o=>{
    const d=document.createElement("span");d.className="chip c"+(o.s?1:0);
    d.innerHTML=`${esc(o.t)} <i>✎</i>`;
    d.onclick=e=>{if(e.target.tagName==="I"){const n=prompt("Fix username:",o.t);if(n&&n.trim())o.t=n.trim()}else o.s=o.s?0:1;render()};
    $("chips").appendChild(d);
  });
}
const add=()=>{const n=$("mn").value.trim();if(!n)return;cands.unshift({t:n,s:1,c:100});$("mn").value="";render()};
$("ma").onclick=add;

/* ---------- Stats API ---------- */
function extract(j){
  const arrs=[];
  (function walk(o,p){
    if(Array.isArray(o)){if(o.length&&o.every(x=>x&&typeof x==="object"&&(x.hero_name||x.hero)))arrs.push([p,o]);o.forEach(x=>walk(x,p))}
    else if(o&&typeof o==="object")for(const k in o)walk(o[k],p+"."+k);
  })(j,"");
  const pick=arrs.find(([p])=>/ranked/i.test(p)&&!/unranked/i.test(p))||arrs[0];
  if(!pick)return [];
  const sc=h=>+(h.matches||h.total_matches||h.play_time||h.time_played||0);
  return pick[1].slice().sort((a,b)=>sc(b)-sc(a)).slice(0,3).map(h=>String(h.hero_name||h.hero));
}
const netMsg=m=>/failed to fetch|networkerror|load failed/i.test(m)?"Request blocked (likely CORS or a wrong URL)":m;
async function lookup(name){
  const base=($("base").value.trim()||"https://marvelrivalsapi.com/api/v1").replace(/\/$/,"");
  const r=await fetch(base+"/player/"+encodeURIComponent(name),{headers:{"x-api-key":$("key").value.trim()}});
  const txt=await r.text();let j=null;try{j=JSON.parse(txt)}catch(e){}
  if(!r.ok)throw Object.assign(new Error("HTTP "+r.status),{raw:txt});
  const h=extract(j);if(!h.length)throw Object.assign(new Error("Response had no hero list"),{raw:txt});
  return h;
}
$("tb").onclick=async()=>{
  save();const n=$("tu").value.trim(),o=$("tr");if(!n)return;
  if(!$("key").value.trim()){o.textContent="Enter your API key first.";return}
  o.textContent="Looking up…";
  try{o.innerHTML="Top heroes: <b>"+esc((await lookup(n)).join(", "))+"</b>"}
  catch(e){o.innerHTML=esc(netMsg(e.message))+(e.raw?"<pre>"+esc(e.raw.slice(0,1500))+"</pre>":"")+`<br><a class="lk f" target="_blank" rel="noopener" href="${prof(n)}">Open on tracker.gg ↗</a>`}
};

/* ---------- Players ---------- */
$("confirm").onclick=async()=>{
  save();
  players=cands.filter(o=>o.s).map(o=>({n:o.t,h:[],st:"Add heroes",fail:false}));
  if(!players.length)return;
  const key=$("key").value.trim();
  if(key)players.forEach(p=>p.st="Looking up…");else players.forEach(p=>p.fail=true);
  $("s3").classList.remove("hide");renderPlayers();$("s3").scrollIntoView({behavior:"smooth"});
  $("s3m").textContent=key?"Fetching top heroes…":"No API key, so open each tracker.gg profile and add their top heroes manually.";
  if(!key)return;
  let bad=0;
  await Promise.all(players.map(async p=>{try{p.h=await lookup(p.n);p.st="Loaded"}catch(e){bad++;p.fail=true;p.st="Lookup failed ("+netMsg(e.message)+"). Open the tracker.gg profile and add heroes manually."}}));
  renderPlayers();$("s3m").textContent=bad?bad+" lookup(s) failed. Use the tracker.gg buttons, then add heroes by hand.":"All loaded. Check them, then build the list.";
};
function renderPlayers(){
  const box=$("plist");box.innerHTML="";
  players.forEach(p=>{
    const r=document.createElement("div");r.className="row";
    const draw=()=>{
      r.innerHTML=`<div class="nm">${esc(p.n)}</div><div class="st">${esc(p.st)}</div><div>${p.h.map((x,i)=>`<span class="chip c0" style="opacity:1">${i+1}. ${esc(x)} <i data-i="${i}">×</i></span>`).join("")}</div>${p.h.length<3?`<input list="hl" placeholder="Add hero #${p.h.length+1}">`:""}<a class="lk${p.fail?" f":""}" target="_blank" rel="noopener" href="${prof(p.n)}">tracker.gg profile ↗</a>`;
      r.querySelectorAll("i").forEach(b=>b.onclick=()=>{p.h.splice(+b.dataset.i,1);draw()});
      const inp=r.querySelector("input");
      if(inp)inp.onchange=()=>{const v=HL.find(h=>h.toLowerCase()===inp.value.trim().toLowerCase());if(v&&!p.h.includes(v)){p.h.push(v);p.st="Edited"}draw()};
    };draw();box.appendChild(r);
  });
}
$("sum").onclick=()=>{
  const m=new Map(),W=[3,2,1];
  players.forEach(p=>p.h.forEach((h,i)=>{const e=m.get(h)||{s:0,who:[]};e.s+=W[i];e.who.push(p.n+" (#"+(i+1)+")");m.set(h,e)}));
  const a=[...m].sort((x,y)=>y[1].s-x[1].s||y[1].who.length-x[1].who.length);
  $("ban").innerHTML=a.length?'<p class="s">Points: 3 / 2 / 1 for each player’s #1 / #2 / #3 hero. Ban from the top.</p>'+a.map(([h,e],i)=>`<div class="hero"><div><b>${i+1}. ${esc(h)}</b><div class="sc">${esc(e.who.join(", "))}</div></div><div style="color:var(--en);font-weight:700">${e.s} pts</div></div>`).join(""):'<p class="s">No hero data entered.</p>';
  $("s4").classList.remove("hide");$("s4").scrollIntoView({behavior:"smooth"});
};
</script></body></html>
